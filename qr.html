<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Justlife QR Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--brand:#02C2FF;--on-brand:#06283D;--ink:#06283D;--ink-2:#4A5D70;--bg:#F3F8FB}
  *{box-sizing:border-box;margin:0}
  body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink-2);padding:24px 16px}
  .tools{max-width:420px;margin:0 auto 24px;display:flex;gap:8px;flex-wrap:wrap}
  .tools input{flex:1 1 220px;font:inherit;padding:12px;border-radius:12px;border:1.5px solid #E3E8EF}
  .tools button{font:inherit;font-weight:700;padding:12px 16px;border:0;border-radius:12px;background:var(--brand);color:var(--on-brand);cursor:pointer}
  .poster{max-width:420px;margin:auto;background:#fff;border-radius:24px;overflow:hidden;
          box-shadow:0 12px 40px rgba(18,35,63,.12);text-align:center}
  .top{background:linear-gradient(155deg,#02C2FF,#0399E0 50%,#0077B6);color:#fff;padding:28px 20px 70px;text-shadow:0 1px 2px rgba(6,40,61,.25)}
  .top img{width:60px;height:60px;border-radius:16px;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
  .top h1{font-size:28px;font-weight:800;margin-top:18px;line-height:1.2}
  .top p{opacity:.85;margin-top:6px}
  .qrbox{background:#fff;width:248px;margin:-52px auto 0;padding:14px;border-radius:20px;box-shadow:0 8px 24px rgba(18,35,63,.12)}
  #qr img,#qr canvas{display:block;width:220px!important;height:220px!important}
  .steps{padding:22px 24px 28px;font-weight:600;color:var(--ink);font-size:15px;line-height:1.9}
  .steps span{color:#0077B6}
  .gift{display:inline-block;background:#E5F8FF;color:#06283D;font-weight:800;border-radius:99px;padding:8px 16px;margin-top:10px}
  @media print{body{background:#fff;padding:0}.tools{display:none}.poster{box-shadow:none}}
</style></head><body>

<div class="tools">
  <input id="url" placeholder="https://your-name.github.io/your-repo/">
  <button onclick="make()">Update QR</button>
  <button onclick="download()">Download PNG</button>
  <button onclick="window.print()">Print</button>
</div>

<div class="poster">
  <div class="top">
    <img src="assets/logo.png" alt="Justlife">
    <h1>Loved your service?</h1>
    <p>Scan, review us on Google, get a gift</p>
  </div>
  <div class="qrbox"><div id="qr"></div></div>
  <div class="steps">
    <span>1.</span> Scan with your phone camera<br>
    <span>2.</span> Share your experience on Google<br>
    <div class="gift">🎁 Get 150 AED off IV Therapy</div>
  </div>
</div>

<script>
  // Default: the folder this file is hosted in (index.php sits next to it)
  const urlInput = document.getElementById('url');
  urlInput.value = location.href.replace(/qr\.html.*$/, '');
  let qr;
  function make(){
    let u = urlInput.value.trim();
    if (!u) return;
    u += (u.includes('?') ? '&' : '?') + 'src=qr';   // tags visits that came from the QR
    document.getElementById('qr').innerHTML = '';
    qr = new QRCode('qr', { text: u, width: 440, height: 440, colorDark: '#06283D', colorLight: '#ffffff',
                            correctLevel: QRCode.CorrectLevel.H });
  }
  function download(){
    const c = document.querySelector('#qr canvas');
    if (!c) return;
    const a = document.createElement('a');
    a.href = c.toDataURL('image/png'); a.download = 'justlife-feedback-qr.png'; a.click();
  }
  make();
</script>
</body></html>
